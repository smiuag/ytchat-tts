# YTChat TTS, configuración de fábrica
# Valores predeterminados. Este archivo se genera con:
#   uv run python config_predeterminada.py
# No editar a mano sin regenerar la otra copia: config_predeterminada.py

[voz]
# Voz SAPI5: 0 es la primera del sistema. Multivoz usa otra voz
# para eventos (Super Chats, regalos). Se cambia en Preferencias > Lectura.
voz = 0
velocidad = 175
volumen = 1.0
multivoz = false
voz_eventos = 0

[cola]
# Cola de lectura: con limite descarta los mas viejos si se llena.
estrategia = limite
tamanio_maximo = 15
umbral_solo_nombre = 0

[reconexion]
# Reconexión automática si se corta el chat.
reconectar = true
espera_entre_intentos = 10
max_intentos = 5

[lectura]
# Que parte del mensaje se lee: nombre y mensaje, solo uno, etc.
formato_prefijo = nombre_mensaje

[filtros]
# Listas en minusculas, separadas por comas. Vacias no filtran.
palabras_silenciadas =
usuarios_silenciados =

[texto]
# Limpieza del texto antes de leer y longitud maxima en caracteres.
limpiar_emojis = true
eliminar_urls = true
max_longitud_mensaje = 200

[atajos]
# Atajos por area: Ctrl para reproductor, Alt para conexion/chat, F para voz.
# F9-F12 se guardan aqui pero no se editan. Alt+F4 y F6 no se guardan.
rep_play = ctrl+p
rep_retro = ctrl+left
rep_avanz = ctrl+right
rep_detener = ctrl+d
rep_mute = ctrl+m
rep_vol_menos = ctrl+down
rep_vol_mas = ctrl+up
descargas_abrir = ctrl+s
pantalla_completa = ctrl+f
abrir_preferencias = ctrl+shift+p
abrir_historial = ctrl+shift+h
marcar_incidencia = ctrl+shift+i
abrir_transmision = ctrl+shift+t
obs_micro = ctrl+shift+m
conectar = alt+c
desconectar = alt+d
enviar_chat = alt+enter
ir_lista = alt+l
pausa = f5
detener_tts = f8
velocidad_menos = f9
velocidad_mas = f10
volumen_menos = f11
volumen_mas = f12
silenciar_lectura = f4
silenciar_sonidos = f7
anunciar_estado = f2

[ui]
# Interfaz: fuente del chat y opciones visibles.
tamanio_fuente_chat = 12
mostrar_total_superchats = true
autoplay_reproductor = true
filtro_activo = todos
silenciar_sonidos = false
mostrar_botones_reproductor = true
cache_video_mb = 1024
mostrar_metadatos = true

[sesion]
# Historial en disco: no, csv o txt. Silenciar lectura al arrancar.
guardar_historial = no
silenciar_lectura = false

[tiktok]
# Solo TikTok: anunciar quien entra al directo puede ser muchisimo.
anunciar_entradas = false

[programados]
activo = false

[diagnostico]
# Registro detallado para diagnosticar fallos (requiere reiniciar).
registro_detallado = false

[overlay]
# Panel de chat para transmitir por navegador (overlay web).
activo = false
puerto = 8730

[obs]
# Integracion con OBS: nombre de la fuente de microfono.
microfono =

[estado]
# Componentes que anuncia F2. true se dice, false se omite.
# Se elige en Preferencias > Estado. El orden en que se dice es fijo.
estado = true
titulo = true
canal = true
espectadores = true
tiempo_directo = true
mensajes_leidos = true
aportes = true
en_cola = false
voz = false
lectura_silenciada = true
overlay = true
programados = true
descartados = false
obs_transmision = false
obs_grabacion = false
obs_escena = false

[descargas]
# Gestor de descargas con yt-dlp. Formato: mp4 | webm | mp3 | m4a.
# Bitrate solo para audio. Carpeta portable junto al ejecutable.
formato = mp4
bitrate = 192
carpeta = Descargas
enumerar = false
